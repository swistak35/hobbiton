
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  # For extra security set this to only accept connections on localhost if NGINX is on the same machine
  # Uncommenting this will mean that you can only reach Home Assistant using the proxy, not directly via IP from other clients.
  # server_host: 127.0.0.1
  use_x_forwarded_for: true

  # You must set the trusted proxy IP address so that Home Assistant will properly accept connections
  # Set this to your NGINX machine IP, or localhost if hosted on the same machine.
  trusted_proxies: 127.0.0.1

binary_sensor:
  - platform: impk
    monitored_conditions:
      - news
sensor:
  - platform: impk
    stops:
      - id: 20723
        name: "DAMROTA"
      - id: 20724
        name: "MOSTY WARSZAWSKIE (autobus)"
      - id: 20629
        name: "MOSTY WARSZAWSKIE (kierunek KROMERA)"
      - id: 20630
        name: "MOSTY WARSZAWSKIE (kierunek CENTRUM)"

binary_sensor:
  - platform: template
    sensors:
      evening_time:
        unique_id: custom_binary_sensor.evening_time
        friendly_name: Pora wieczorna
        entity_id: sensor.time
        value_template: >
           {% set ct = now().hour + now().minute/60 + now().second/3600 %}
           {{ 21 <= ct <= 25 }}

# Spacerek — rekomendacje ubioru dla dzieci (custom_components/spacerek).
# Źródła pogody mają domyślne wartości (OpenWeatherMap + GIOŚ) i można je pominąć.
spacerek:
  children:
    - name: Filip
      birthdate: "2026-04-18"
    - name: Łucja
      birthdate: "2020-10-07"

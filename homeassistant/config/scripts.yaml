poranne_informacje_z_ai:
  sequence:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.lucja_lasocha
      - calendar.rafal_lasocha_gmail_com
      - calendar.wspolny
      - calendar.emilia_lasocha_net
    data:
      start_date_time: '{{ now().replace(hour=6, minute=0, second=0).isoformat() }}'
      end_date_time: '{{ now().replace(hour=23, minute=59, second=59).isoformat()
        }}'
    response_variable: calendar_events
  - action: weather.get_forecasts
    data:
      type: hourly
    response_variable: hourly_weather
    target:
      entity_id: weather.openweathermap
  - action: google_generative_ai_conversation.generate_content
    data:
      prompt: "Jesteś asystentem domowego systemu automatyzacji. Nie dawaj mi opcji,
        bo to co odpowiesz zostanie odtworzone na głośnikach. \nZachowuj się profesjonalnie.\nPoniżej
        zamieszczę wszystkie informacje które musisz nam przekazać.\n- Powitaj nowy
        dzień.\n- Dzisiaj jest {{ states('sensor.dzien_tygodnia') }}.\n- Średnia temperatura
        w domu to {{ states('sensor.srednia_temperatura') }}.\n{% if hourly_weather
        %}\n  {% set current_weather = hourly_weather[\"weather.openweathermap\"][\"forecast\"]
        | first %}\n  {% set weather_next = hourly_weather[\"weather.openweathermap\"][\"forecast\"][1]
        %}\n  {% set weather12h = hourly_weather[\"weather.openweathermap\"][\"forecast\"]
        | slice(4) | first %}\n- Aktualna temperatura na zewnątrz to {{ current_weather['temperature']
        | round }} stopni celsjusza.\n- Aktualna odczuwalna temperatura na zewnątrz
        to {{ current_weather['apparent_temperature'] | round }} stopni celsjusza.
        * Maksymalna temperatura w ciągu dnia to {{ weather12h | map(attribute=\"temperature\")
        | max | round }} * Aktualna pogoda na zewnątrz to to {{ current_weather['condition']
        }}. * Szansa na opady dzisiaj to do {{ weather12h | map(attribute=\"precipitation_probability\")

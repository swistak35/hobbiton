zzz_test_tts:
  alias: ZZZ Test TTS
  sequence:
  - service: calendar.get_events
    metadata: {}
    data:
      duration:
        hours: 23
        minutes: 59
        seconds: 59
      start_date_time: '{{ today_at().strftime(''%Y-%m-%d %H:%M'') }}'
    response_variable: today_agenda
    target:
      label_id: kalendarze
  - service: tts.speak
    target:
      entity_id: tts.google_pl_pl
    data:
      media_player_entity_id: media_player.googlehome5990
      message: "Test głosowy.\n{% for bus in state_attr('sensor.impk_damrota', 'list')
        %}\n  {% set departure_time = today_at(bus.departure) %}\n  {% if (now() +
        as_timedelta(\"PT20M\") > departure_time) and (departure_time > now()) %}\n
        \   {% set departure_in_minutes = ((departure_time - now()).seconds / 60)
        | round %}\n    Linia {{ bus.line }}, odjazd za {{ departure_in_minutes }}
        minut\n  {% endif %}\n{% endfor %}"
  mode: single
  fields: {}
  description: ''
tts_and_resume:
  alias: TTS and resume
  mode: single
  description: ''
  icon: mdi:account-voice
  fields:
    media_player_entity_id:
      selector:
        entity: {}
      name: Media Player (Entity ID)
      required: true
    message:
      selector:
        text:
      name: Message
      required: true
    message_delay:
      selector:
        duration: {}
      name: Message Delay
      required: true
    tts_volume:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
      name: Volume
      required: true
  variables:
    media_content_id: '{{ state_attr(media_player_entity_id, ''media_content_id'')
      }}'
    mediaplayer_volume_level: '{{ state_attr(media_player_entity_id, ''volume_level'')
      }}'
    mediaplayer_state: '{{ states(media_player_entity_id) }}'
  sequence:
  - if:
    - condition: template
      value_template: '{{ is_state(media_player_entity_id, ''playing'') }}'
    then:
    - action: media_player.media_pause
      metadata: {}
      data: {}
      target:
        entity_id: '{{ media_player_entity_id }}'
  - data:
      entity_id: '{{ media_player_entity_id }}'
    action: media_player.media_pause
    enabled: false
  - delay: 1
  - data:
      entity_id: '{{ media_player_entity_id }}'
      volume_level: '{{ tts_volume }}'
    action: media_player.volume_set
  - delay: 1
  - target:
      entity_id: tts.google_pl_pl
    data:
      media_player_entity_id: '{{ media_player_entity_id }}'
      message: '{{ message }}'
    action: tts.speak
  - delay: '{{ message_delay }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mediaplayer_state == ''playing'' }}'
      sequence:
      - data:
          entity_id: '{{ media_player_entity_id }}'
          volume_level: '{{ mediaplayer_volume_level }}'
        action: media_player.volume_set
      - delay: 2
      - data:
          entity_id: '{{ media_player_entity_id }}'
          media_content_id: '{{ media_content_id }}'
          media_content_type: music
        action: media_player.play_media
    default:
    - data:
        entity_id: '{{ media_player_entity_id }}'
      action: media_player.turn_off

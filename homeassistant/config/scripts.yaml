      title: Odtwórzy komunikat Minutnik zakończony.
  description: ''
  fields:
    target_device_id:
      selector:
        device: {}
      name: Device ID
      required: true
    target_entity_id:
      selector:
        entity: {}
      name: Entity ID
      required: true
    time_duration:
      selector:
        duration: {}
      name: Czas
      required: true

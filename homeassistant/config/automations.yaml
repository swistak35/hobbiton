- id: '1719526678190'
  alias: TTS jak ktoś przychodzi do przedszkola
  description: ''
  trigger:
  - platform: zone
    entity_id:
    - person.rafal
    - person.emilka
    zone: zone.przedszkole
    event: enter
  - platform: zone
    entity_id:
    - person.rafal
    - person.emilka
    zone: zone.przedszkole
    event: leave
  action:
  - service: notify.mobile_app_sm_g780g
    metadata: {}
    data:
      message: '{{ trigger.to_state.name }} {{ iif(trigger.event == ''enter'', ''wchodzi
        do'', ''wychodzi z'') }} przedszkola'
  - service: script.tts_and_resume
    metadata: {}
    data:
      media_player_entity_id: media_player.googlehome5990
      message: '{{ trigger.to_state.name }} {{ iif(trigger.event == ''enter'', ''wchodzi
        do'', ''wychodzi z'') }} przedszkola'
      message_delay:
        hours: 0
        minutes: 0
        seconds: 3
      tts_volume: 0.4
  mode: single
